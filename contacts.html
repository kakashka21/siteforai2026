<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI 2026 — Контакты</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="normalize.css">

</head>

<body>

<header>

  <div class="container">

    <nav>

      <div class="logo">
        MIDiS
      </div>

      <div class="menu">

        <a href="index.html">
          Главная
        </a>

        <a href="spells.html">
          Возможности
        </a>

        <a href="tools.html">
          Инструменты
        </a>

        <a href="contacts.html">
          Контакты
        </a>

      </div>

    </nav>

  </div>

</header>

<section class="hero">

  <div class="container">

    <div class="card">

      <h1 class="section-title">
        Связаться с нами
      </h1>

      <p
      style="
      text-align:center;
      max-width:700px;
      margin:0 auto 50px;
      color:#A8A8B8;
      line-height:1.8;
      ">

        Если у вас есть вопросы
        по искусственному интеллекту,
        AI-инструментам или сотрудничеству —
        заполните форму ниже.

      </p>

      <form class="contact-form">

        <input
        type="text"
        placeholder="Ваше имя">

        <input
        type="email"
        placeholder="Email">

        <textarea
        placeholder="Ваше сообщение"></textarea>

        <button class="btn">

          Отправить сообщение

        </button>

      </form>

    </div>

  </div>

</section>

<section>

  <div class="container">

    <div class="cards">

      <div class="card">

        <div class="icon"></div>

        <h3>
          Email
        </h3>

        <p>
          support@ai2026.com
        </p>

      </div>

      <div class="card">

        <div class="icon"></div>

        <h3>
          Telegram
        </h3>

        <p>
          @MIDiS
        </p>

      </div>

      <div class="card">

        <div class="icon"></div>

        <h3>
          Время ответа
        </h3>

        <p>
          Обычно отвечаем
          в течение 24 часов.
        </p>

      </div>

    </div>

  </div>

</section>

<footer>

  <div class="container footer">

    <div class="logo">
      MIDiS
    </div>

    <p>
      © 2026 MIDiS
    </p>

  </div>

</footer>

</body>

</html>
